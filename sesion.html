  <main>
    <section class="form-container">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Portal MyGrape's</h2>
      
      <form action="#" method="POST">
        <div class="form-group">
          <label for="usuario">ID / Correo de usuario</label>
          <input type="email" id="usuario" name="usuario" placeholder="usuario@ejemplo.com" required>   
        </div>
        
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>   
        </div>

        <button class="btn" type="submit" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
      </form>
    </section>
